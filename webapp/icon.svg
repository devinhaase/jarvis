<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="35%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#122236"/>
      <stop offset="55%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#05090f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7fd4ff"/>
      <stop offset="100%" stop-color="#0b3a5c"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="36" fill="url(#bg)"/>

  <!-- HUD corner ticks, echoing the web app's own corner brackets -->
  <g stroke="#bfe8ff" stroke-width="2.5" opacity="0.55" fill="none">
    <path d="M24 40 V24 H40"/>
    <path d="M168 40 V24 H152"/>
    <path d="M24 152 V168 H40"/>
    <path d="M168 152 V168 H152"/>
  </g>

  <!-- reactor rings -->
  <circle cx="96" cy="96" r="58" fill="none" stroke="#bfe8ff" stroke-width="2" opacity="0.55"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-dasharray="6 7" opacity="0.7"/>

  <!-- glowing core -->
  <circle cx="96" cy="96" r="30" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="30" fill="url(#core)"/>
</svg>
