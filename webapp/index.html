<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0a84ff">
</head>
<body>
<div id="app">

  <button id="sidebarToggle" class="icon-btn sidebar-toggle" title="Toggle conversations">☰</button>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="brand">JARVIS</span>
      <button id="pushSettingsBtn" class="icon-btn" title="Notification settings">🔔</button>
      <button id="themeToggleBtn" class="icon-btn" title="Toggle light/dark theme">🌗</button>
      <button id="newConvBtn" class="icon-btn" title="New conversation">+</button>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search conversations…" autocomplete="off">
      <button id="semanticToggle" class="icon-btn small" title="Toggle semantic (meaning-based) search">🧠</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <span>PROJECTS</span>
        <button id="newProjectBtn" class="icon-btn small" title="New project">+</button>
      </div>
      <div id="projectList" class="project-list"></div>
    </div>

    <div class="sidebar-section-header conv-section-header">
      <span id="convSectionLabel">ALL CONVERSATIONS</span>
      <button id="clearProjectFilterBtn" class="text-btn hidden" title="Show all conversations">clear</button>
    </div>
    <div id="convList" class="conv-list"></div>

    <div id="integrationStatusPanel" class="integration-status-panel">
      <span class="integration-dot" id="statusDotObsidian" title="Obsidian vault">🗒</span>
      <span class="integration-dot" id="statusDotGmail" title="Gmail">✉</span>
      <span class="integration-dot" id="statusDotCalendar" title="Calendar">📅</span>
      <span class="integration-dot" id="statusDotDrive" title="Drive">📁</span>
    </div>

    <div class="sidebar-footer">
      <button id="toolsBtn" class="text-btn">🛠 Tools</button>
      <button id="teamsBtn" class="text-btn">🤖 Teams</button>
      <button id="skillsBtn" class="text-btn">🧩 Skills<span id="skillsPendingBadge" class="pending-badge hidden">0</span></button>
      <!-- The Overseer/team dashboard (formerly an in-SPA Dashboard/Chat tab here — see
           task.md's entry on why it moved) and Phase 8c's Living Mind (its own three.js
           scene, own /ws/mind socket) are both full standalone pages now, so both open in
           a new tab rather than swapping into #contentArea — that way a new chat here
           always opens straight to chat, and either view can sit on its own screen. -->
      <a id="dashboardBtn" class="text-btn" href="/dashboard" target="_blank" rel="noopener">📊 Dashboard</a>
      <a id="livingMindBtn" class="text-btn" href="/mind" target="_blank" rel="noopener">🧠 Living Mind</a>
      <span id="connStatus" class="conn-status offline">connecting…</span>
    </div>
  </aside>

  <div id="sidebarOverlay"></div>

  <div id="contentArea">
    <main id="main">
      <header id="chatHeader">
        <h1 id="convTitle" contenteditable="true" spellcheck="false">Jarvis</h1>
        <span id="projectBadge" class="project-badge hidden"></span>
        <span id="listeningIndicator" class="listening-indicator hidden">
          <span class="dot"></span> listening…
        </span>
        <button id="exportBtn" class="icon-btn small header-right" title="Export this conversation as markdown">⬇</button>
      </header>

      <div id="messages" class="messages"></div>

      <div id="attachmentBar" class="attachment-bar hidden"></div>

      <form id="composer" class="composer">
        <button type="button" id="attachBtn" class="icon-btn composer-btn" title="Attach files">📎</button>
        <button type="button" id="attachFolderBtn" class="icon-btn composer-btn" title="Attach a folder">📁</button>
        <input type="file" id="fileInput" multiple hidden>
        <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
        <textarea id="composerInput" placeholder="Message Jarvis…" rows="1" autocomplete="off"></textarea>
        <button type="button" id="micBtn" class="icon-btn composer-btn" title="Voice input">🎤</button>
        <button id="sendBtn" type="submit" class="send-btn" title="Send">➤</button>
      </form>
    </main>
  </div>

  <div id="toolsModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Tools</span>
        <button id="toolsCloseBtn" class="icon-btn">✕</button>
      </div>
      <div id="toolsBody" class="modal-body"></div>
    </div>
  </div>

  <div id="teamsModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Teams</span>
        <button id="teamsCloseBtn" class="icon-btn">✕</button>
      </div>
      <div id="teamsBody" class="modal-body"></div>
    </div>
  </div>

  <div id="skillsModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Skill Review Queue</span>
        <button id="skillsCloseBtn" class="icon-btn">✕</button>
      </div>
      <div id="skillsBody" class="modal-body"></div>
    </div>
  </div>

  <div id="pushModal" class="modal-overlay hidden">
    <div class="modal modal-small">
      <div class="modal-header">
        <span>Notifications</span>
        <button id="pushCloseBtn" class="icon-btn">✕</button>
      </div>
      <div class="modal-body push-settings-body">
        <label class="push-toggle-row">
          <input type="checkbox" id="pushEnabledToggle">
          <span>Push notifications on this device</span>
        </label>
        <div id="pushCategoriesSection" class="push-categories hidden">
          <div class="tool-group-title">Categories</div>
          <label class="push-toggle-row"><input type="checkbox" id="pushCatApprovals"><span>Approvals — Tier 3/4 confirmations</span></label>
          <label class="push-toggle-row"><input type="checkbox" id="pushCatAlerts"><span>Alerts — security posture changes</span></label>
          <label class="push-toggle-row"><input type="checkbox" id="pushCatBriefing"><span>Daily briefing</span></label>
          <label class="push-toggle-row"><input type="checkbox" id="pushCatMessages"><span>Every reply (can be noisy)</span></label>
          <div class="tool-group-title">Quiet hours</div>
          <label class="push-toggle-row"><input type="checkbox" id="pushQuietEnabled"><span>Enabled (Tier-4 confirmations still come through)</span></label>
          <div class="push-quiet-times">
            <input type="time" id="pushQuietStart"> to <input type="time" id="pushQuietEnd">
          </div>
          <button id="pushTestBtn" class="text-btn small">Send test notification</button>
        </div>
      </div>
    </div>
  </div>

  <div id="projectModal" class="modal-overlay hidden">
    <div class="modal modal-small">
      <div class="modal-header">
        <span>New project</span>
        <button id="projectModalCloseBtn" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <input id="projectNameInput" type="text" placeholder="Project name" autocomplete="off">
        <button id="projectCreateBtn" class="primary-btn">Create</button>
      </div>
    </div>
  </div>

  <div id="moveModal" class="modal-overlay hidden">
    <div class="modal modal-small">
      <div class="modal-header">
        <span>Move to project</span>
        <button id="moveModalCloseBtn" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <div id="moveModalList" class="move-list"></div>
      </div>
    </div>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
